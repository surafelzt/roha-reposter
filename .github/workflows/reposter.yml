name: reposter

on:
  schedule:
    # Every hour from 06:17 to 22:17 Addis Ababa time (UTC+3 = 03:17 to 19:17 UTC)
    - cron: "17 3-19 * * *"
  workflow_dispatch:

concurrency:
  group: reposter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REPOSTER_BOT_TOKEN: ${{ secrets.REPOSTER_BOT_TOKEN }}
      STORAGE_CHAT_ID: ${{ secrets.STORAGE_CHAT_ID }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      READER_KEY: ${{ secrets.READER_KEY }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reader/requirements.txt

      - name: Install reader packages
        run: pip install -r reader/requirements.txt

      - name: Run the reader
        run: python reader/reposter_run.py
